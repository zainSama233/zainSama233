<svg xmlns="http://www.w3.org/2000/svg" width="960" height="264" viewBox="0 0 960 264">
  <title>MouseWheel — Hold, Aim, Release</title>
  <desc>MouseWheel's middle-button gesture, illustrated as an eight-sector radial menu with one highlighted selection.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#171925"/>
      <stop offset="1" stop-color="#27263e"/>
    </linearGradient>
    <radialGradient id="field">
      <stop stop-color="#9d87ff" stop-opacity=".19"/>
      <stop offset="1" stop-color="#9d87ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="selection" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#7258ca"/>
      <stop offset="1" stop-color="#b9a5ff"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c5b6fa" opacity=".24"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="264" rx="14"/></clipPath>
    <mask id="grid-mask">
      <rect x="484" width="476" height="264" fill="url(#field)"/>
    </mask>
    <path id="sector" d="M-35-81 A88 88 0 0 1 35-81 L15-38 A40 40 0 0 0 -15-38 Z"/>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="264" fill="url(#panel)"/>
    <ellipse cx="726" cy="132" rx="272" ry="210" fill="url(#field)"/>
    <rect x="484" width="476" height="264" fill="url(#dots)" mask="url(#grid-mask)"/>
    <path d="M70 52h28" stroke="#baabff" stroke-width="2"/>
    <g font-family="system-ui, Segoe UI, sans-serif">
      <text x="111" y="57" font-size="13" fill="#d5caff" font-weight="700" letter-spacing="2.8">MOUSEWHEEL / GESTURE</text>
      <text x="68" y="128" font-size="58" fill="#fbf9ff" font-weight="650" letter-spacing="-2.7">Hold. Aim.</text>
      <text x="68" y="186" font-size="58" fill="#c8b7ff" font-weight="650" letter-spacing="-2.7">Release.</text>
    </g>
    <g transform="translate(727 132)">
      <path d="M-159 0H159 M0-116V116" fill="none" stroke="#a493e2" stroke-opacity=".28" stroke-dasharray="2 5"/>
      <circle r="103" fill="none" stroke="#a493e2" stroke-opacity=".41"/>
      <circle r="96" fill="none" stroke="#a493e2" stroke-opacity=".29" stroke-dasharray="2 5"/>
      <g fill="#3b3657" stroke="#8275aa" stroke-width="1">
        <use href="#sector"/>
        <use href="#sector" transform="rotate(90)"/>
        <use href="#sector" transform="rotate(135)"/>
        <use href="#sector" transform="rotate(180)"/>
        <use href="#sector" transform="rotate(225)"/>
        <use href="#sector" transform="rotate(270)"/>
        <use href="#sector" transform="rotate(315)"/>
      </g>
      <use href="#sector" transform="rotate(45)" fill="url(#selection)" stroke="#d9caff" stroke-width="1.5"/>
      <circle r="30" fill="#25243a" stroke="#aa98e2" stroke-opacity=".74"/>
      <circle r="23" fill="none" stroke="#aa98e2" stroke-opacity=".22"/>
      <g fill="none" stroke="#eee8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8" y="-12" width="16" height="24" rx="8"/>
        <path d="M0-8v5" stroke="#c8b7ff" stroke-width="2.6"/>
      </g>
      <g fill="none" stroke="#d1c8ec" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-9-68h18v12H-9z M-3-53h6 M0-56v3"/>
        <path d="M-49-52h9m-9 5h11m-11 5h7m-10-13h17v16h-17z"/>
        <path d="M-69-5v-4h4m6 0h4v4m0 6v4h-4m-6 0h-4v-4"/>
        <path d="M-52 47l7-7 4 4-7 7-5 1z M-47 43l4 4"/>
        <path d="M-9 59h7l2 2h9v9H-9z"/>
        <path d="M40 44h12m-6-6v12 M43 41l6 6m0-6-6 6"/>
        <path d="M56-6h13v12H56z M59-1l2 2-2 2m5 0h2"/>
      </g>
      <g fill="none" stroke="#181127" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M46-51h8v8m0-8-11 11m0-9h-5v14h14v-5"/>
      </g>
      <path d="M41-23v21l5-5 4 8 4-2-4-8h8z" fill="#faf6ff" stroke="#201932" stroke-width="2" stroke-linejoin="round"/>
      <g fill="#c8b7ff">
        <circle cx="-103" cy="0" r="2.2"/>
        <circle cx="0" cy="103" r="2.2"/>
        <circle cx="103" cy="0" r="2.2"/>
      </g>
    </g>
    <rect x=".5" y=".5" width="959" height="263" rx="13.5" fill="none" stroke="#c5b6fa" stroke-opacity=".24"/>
  </g>
</svg>
